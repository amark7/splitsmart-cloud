{% extends 'base.html' %}

{% block content %}

<h2>{{ group.name }}</h2>

<form method="POST">

    <input
        class="form-control mb-2"
        type="text"
        name="member_name"
        placeholder="Enter Member Name">

    <button
        class="btn btn-success">
        Add Member
    </button>

</form>

<hr>

<h4>Members</h4>

<ul class="list-group">

{% for member in group.members %}

<li class="list-group-item">

    {{ member }}

</li>

{% endfor %}

</ul>

{% endblock %}
