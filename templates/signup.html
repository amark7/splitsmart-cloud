{% extends 'base.html' %}

{% block content %}

<h2>Signup</h2>

<form method="POST">

    <input class="form-control mb-2"
           type="email"
           name="email"
           placeholder="Email">

    <input class="form-control mb-2"
           type="password"
           name="password"
           placeholder="Password">

    <button class="btn btn-success">
        Signup
    </button>

</form>

{% endblock %}
